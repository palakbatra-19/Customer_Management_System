services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: newdb
      MYSQL_ROOT_PASSWORD: root@1234
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: newdb
      DB_USER: root
      DB_PASSWORD: root@1234

volumes:
  mysql_data: